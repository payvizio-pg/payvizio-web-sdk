<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payvizio Web SDK — example</title>
    <style>
        body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
        button { padding: 10px 18px; font-size: 16px; border: 0; border-radius: 8px; background: #4f46e5; color: white; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        pre { background: #f3f4f6; padding: 12px; border-radius: 6px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Payvizio Web SDK demo</h1>
    <p>
        This page mirrors what an integrating merchant would do: server creates a session,
        hands the session id to the page, the page calls <code>Payvizio.checkout(...)</code>.
    </p>

    <p>
        <label>Session ID: <input id="sid" type="text" placeholder="sess_xxx" size="40" /></label>
    </p>
    <p>
        <button id="pay">Pay now</button>
    </p>
    <pre id="log">events appear here…</pre>

    <!-- For local dev, point at the compiled bundle in dist/. In production this would be a CDN URL. -->
    <script src="../dist/payvizio.umd.js"></script>
    <script>
        const log = (...args) => {
            const line = args.map(a => typeof a === "string" ? a : JSON.stringify(a, null, 2)).join(" ");
            document.getElementById("log").textContent += "\n" + line;
        };

        const pv = Payvizio.init({
            apiBaseUrl: "https://api.payvizio.com",
            // pollIntervalMs: 2500,
        });

        document.getElementById("pay").addEventListener("click", () => {
            const sid = document.getElementById("sid").value.trim();
            if (!sid) { alert("Enter a session id first"); return; }
            log("opening checkout for", sid);
            pv.checkout({
                sessionId: sid,
                onUpdate:  (s) => log("update", s),
                onSuccess: (s) => log("SUCCESS", s),
                onFailure: (s) => log("FAILURE", s),
                onClose:   ()  => log("closed by user"),
            });
        });
    </script>
</body>
</html>
